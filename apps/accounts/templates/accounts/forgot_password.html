{% extends 'auth_base.html' %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<h2>Forgot password</h2>
<p class="sub">Enter your registered email and we'll send you a reset link.</p>
<form id="forgot-form" novalidate>
  <div class="alert error" hidden style="margin-top:16px"></div>
  <div class="alert success" id="forgot-ok" hidden style="margin-top:16px"></div>
  <div class="field"><label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com"></div>
  <button class="btn" type="submit">Send reset link</button>
</form>
<div class="auth-links"><a href="{% url 'page-login' %}">← Back to sign in</a></div>
{% endblock %}
