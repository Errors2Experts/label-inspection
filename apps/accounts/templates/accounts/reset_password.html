{% extends 'auth_base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h2>Set a new password</h2>
<p class="sub">Choose a strong password of at least 8 characters.</p>
<form id="reset-form" novalidate>
  <div class="alert error" hidden style="margin-top:16px"></div>
  <div class="field"><label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" required></div>
  <div class="field"><label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
  <button class="btn" type="submit">Reset password</button>
</form>
<div class="auth-links"><a href="{% url 'page-login' %}">← Back to sign in</a></div>
{% endblock %}
